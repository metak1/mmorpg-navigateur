<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>mmorpg-navigateur</title>
    <style>
      html, body {
        margin: 0;
        background: #111;
        height: 100%;
        overflow: hidden;
      }

      /* 100dvh (not 100vh) so mobile browser chrome that shows/hides on
         scroll doesn't leave a stale gap sized for the taller viewport. */
      #game-layout {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 16px;
        width: 100vw;
        height: 100dvh;
        padding: 16px;
        box-sizing: border-box;
      }

      /* Sized entirely by flex (fills whatever space isn't taken by the
         sidebar); Phaser's scale manager (see main.ts's FIT mode) reads this
         element's box each resize and scales the fixed-resolution canvas to
         fit inside it, letterboxing rather than stretching so the game view
         itself never changes regardless of device/window size. */
      #app {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        line-height: 0;
      }

      /* One big panel that swaps content (chat by default). Stretches to
         match #app's height (see #game-layout's align-items: stretch)
         instead of a fixed pixel height, so it still lines up at any
         viewport size. */
      #sidebar {
        flex: 0 0 300px;
        display: flex;
        flex-direction: column;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        font-family: sans-serif;
      }

      /* Hidden on wide screens — on a phone-width viewport, a 300px sidebar
         sitting alongside the canvas leaves almost nothing for the game
         itself, so below this breakpoint the sidebar becomes an off-canvas
         overlay (see the media query below) opened/closed with this button
         instead of always occupying screen width. */
      #sidebar-toggle {
        display: none;
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 40;
        width: 40px;
        height: 40px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
      }

      @media (max-width: 700px) {
        #sidebar-toggle { display: flex; align-items: center; justify-content: center; }

        #game-layout { gap: 0; padding: 0; }

        #sidebar {
          position: fixed;
          inset: 0;
          z-index: 30;
          flex: none;
          border: none;
          border-radius: 0;
          transform: translateX(100%);
          transition: transform 0.2s ease;
        }
        #sidebar.open { transform: translateX(0); }
      }

      #sidebar-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px;
        border-bottom: 1px solid #333;
      }
      .sidebar-tab {
        flex: 1 1 40%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 4px;
        border-radius: 6px;
        font-size: 12px;
        color: #888;
        cursor: pointer;
        user-select: none;
      }
      .sidebar-tab:hover { background: #242424; color: #ccc; }
      .sidebar-tab.active { background: #2a2a2a; color: #fff; }
      .sidebar-tab kbd {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: #000;
        border: 1px solid #444;
        color: #999;
      }

      #sidebar-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        color: #555;
        font-size: 13px;
        padding: 12px;
      }

      #stats-sheet { display: flex; flex-direction: column; gap: 4px; }
      #stats-header { color: #fff; font-size: 15px; font-weight: 600; margin-bottom: 8px; }
      .stats-bar-label { color: #999; font-size: 11px; margin-top: 6px; }
      .stats-bar-bg {
        width: 100%;
        height: 10px;
        background: #111;
        border: 1px solid #333;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 2px;
      }
      .stats-bar-fill { height: 100%; }
      .stats-bar-hp { background: #33dd55; }
      .stats-bar-xp { background: #ffcc33; }
      #stats-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #2a2a2a;
      }
      .stats-row { display: flex; justify-content: space-between; font-size: 13px; }
      .stats-label { color: #999; }
      .stats-value { color: #fff; font-weight: 600; }

      #admin-tools {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #2a2a2a;
      }
      #admin-tools button {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid #ff9d2e;
        background: #2a1f10;
        color: #ff9d2e;
        font-weight: bold;
        cursor: pointer;
      }
      #admin-tools button:hover { background: #3a2a14; }

      /* GroupFinder (packages/client/src/ui/GroupFinder.ts) renders into
         whatever container its caller hands it — the sidebar's Party tab
         body, or the dungeon prompt's group dock — so these are classes,
         not ids, since both can exist in the document at once. */
      .group-finder { display: flex; flex-direction: column; gap: 6px; }
      .group-finder-tabs { display: flex; gap: 4px; margin-bottom: 4px; }
      .group-finder-tab {
        flex: 1 1 auto;
        padding: 6px 4px;
        font-size: 12px;
        border-radius: 6px;
        border: none;
        background: #111;
        color: #888;
        cursor: pointer;
      }
      .group-finder-tab:hover { color: #ccc; }
      .group-finder-tab.active { background: #2a2a2a; color: #fff; }
      .group-finder-header {
        color: #999;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #2a2a2a;
      }
      .group-finder-roster, .group-finder-invite-list, .group-finder-applicant-list, .group-finder-browse-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .group-finder-open-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #999;
      }
      .group-finder-leave-btn {
        align-self: flex-start;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid #ff5555;
        background: #2a1010;
        color: #ff5555;
        font-weight: bold;
        cursor: pointer;
      }
      .group-finder-leave-btn:hover { background: #3a1414; }
      .group-finder-create-btn {
        align-self: flex-start;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        font-weight: bold;
        cursor: pointer;
      }
      .group-finder-create-btn:hover { background: #33ffa2; }
      .group-finder-applicant-actions { display: flex; gap: 6px; flex-shrink: 0; }
      .bag-item button.group-finder-decline-btn {
        background: #2a1010;
        color: #ff5555;
        border: 1px solid #ff5555;
      }
      .bag-item button.group-finder-decline-btn:hover { background: #3a1414; }

      /* Rarity accents, reused for both equipped slots and bag rows. */
      .rarity-common { border-color: #555 !important; }
      .rarity-rare { border-color: #4d9fff !important; }
      .rarity-epic { border-color: #c060f0 !important; }
      .rarity-legendary { border-color: #ff9d2e !important; }

      #inventory-panel { display: flex; flex-direction: column; gap: 6px; }
      #equipment-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 4px;
      }
      .equipment-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 48px;
        padding: 4px;
        border: 1px solid #333;
        border-radius: 6px;
        text-align: center;
      }
      .equipment-slot.empty { background: #161616; }
      .equipment-slot.filled { background: #1f1f1f; cursor: pointer; }
      .equipment-slot.filled:hover { background: #292929; }
      .equipment-slot-label { color: #777; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
      .equipment-slot-item { color: #fff; font-size: 12px; font-weight: 600; }

      #bag-header {
        color: #999;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 10px 0 4px;
        padding-top: 10px;
        border-top: 1px solid #2a2a2a;
      }
      #bag-list { display: flex; flex-direction: column; gap: 8px; }
      .bag-empty { color: #555; font-size: 12px; }
      .bag-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .bag-item-name { color: #fff; font-size: 13px; font-weight: 600; }
      .bag-item-desc { color: #888; font-size: 11px; margin-top: 2px; }
      .bag-item button {
        flex-shrink: 0;
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        font-weight: bold;
        cursor: pointer;
      }

      #talent-points { color: #ffcc33; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
      /* Each tier is a CSS grid with the same fixed column tracks (set
         inline per row from Sidebar.renderTalents, via
         assignTalentColumns) so a given column lines up pixel-for-pixel
         across every row — that's what keeps a talent directly under its
         prerequisite. The connector lines are an absolutely-positioned SVG
         overlay drawn on top once the nodes are laid out. */
      #talent-tree { position: relative; overflow-x: auto; }
      #talent-lines { position: absolute; top: 0; left: 0; pointer-events: none; }
      .talent-line { stroke: #3a3a3a; stroke-width: 2; }
      .talent-line.active { stroke: #ffcc33; }
      .talent-tier-row {
        position: relative;
        z-index: 1;
        display: grid;
        justify-content: center;
        gap: 28px;
        margin-bottom: 40px;
      }
      .talent-node-icon {
        position: relative;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #333;
        border-radius: 6px;
        background: #1a1a1a;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        user-select: none;
      }
      .talent-node-icon.learnable { border-color: #00ff88; cursor: pointer; }
      .talent-node-icon.learnable:hover { background: #232323; }
      .talent-node-icon.maxed { border-color: #4d9fff; }
      .talent-node-icon.locked { opacity: 0.4; }
      .talent-node-rank-badge {
        position: absolute;
        right: -6px;
        bottom: -6px;
        padding: 1px 3px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #000;
        color: #ccc;
        font-size: 9px;
        font-weight: 600;
      }
      /* position:fixed + top/left set in JS (see Sidebar.renderTalents) —
         the tree lives inside #sidebar-body's overflow-y:auto, so an
         absolutely-positioned tooltip anchored above/below the node would
         get clipped by that ancestor whenever the node is near the top or
         bottom of the scroll area. Fixed positioning escapes that clipping
         and lets the JS flip the tooltip above/below based on real
         available space. */
      .talent-tooltip {
        display: none;
        position: fixed;
        width: 170px;
        padding: 8px;
        border: 1px solid #444;
        border-radius: 6px;
        background: #111;
        text-align: left;
        z-index: 50;
        pointer-events: none;
      }
      .talent-tooltip-title { color: #fff; font-size: 12px; font-weight: 700; margin-bottom: 3px; }
      .talent-tooltip-desc { color: #999; font-size: 11px; margin-bottom: 4px; }
      .talent-tooltip-rank { color: #ffcc33; font-size: 11px; font-weight: 600; }

      #quest-log-list, #quest-log-completed-list { display: flex; flex-direction: column; gap: 10px; }
      .quest-log-item {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .quest-log-title { color: #fff; font-size: 13px; font-weight: 600; }
      .quest-log-summary { color: #999; font-size: 12px; margin-top: 4px; }
      .quest-log-empty { color: #777; font-size: 12px; }
      #quest-log-completed-toggle {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 6px 10px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #ccc;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      #quest-log-completed-toggle:hover { background: #242424; color: #fff; }
      #quest-log-completed-list { margin-top: 10px; }
      .quest-log-item-completed { color: #888; font-size: 13px; }

      #npc-dialogue-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        font-family: sans-serif;
      }
      #npc-dialogue-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        min-width: 320px;
        max-width: 420px;
      }
      #npc-dialogue-panel h3 { margin: 0; color: #00ff88; font-size: 16px; }
      .npc-dialogue-empty { color: #999; font-size: 13px; margin: 0; }
      .npc-dialogue-option {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
      }
      .npc-dialogue-option-title { color: #fff; font-size: 14px; font-weight: 600; }
      .npc-dialogue-option-desc { color: #aaa; font-size: 12px; }
      .npc-dialogue-option-summary { color: #ffcc66; font-size: 12px; }
      .npc-dialogue-hint { color: #666; font-size: 11px; font-style: italic; }
      .npc-dialogue-option button {
        align-self: flex-start;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        font-weight: bold;
        cursor: pointer;
      }
      #npc-dialogue-close {
        align-self: flex-end;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid #444;
        background: none;
        color: #ccc;
        cursor: pointer;
      }

      /* Draggable, freely-positioned over the game view (see
         PartyFrames.ts) — position: fixed rather than living inside
         #game-layout's flex flow, since it must be able to sit on top of
         the canvas anywhere the player drags it, including outside
         #game-layout's own box on very small viewports. */
      #party-frames {
        position: fixed;
        z-index: 15;
        width: 180px;
        background: rgba(17, 17, 17, 0.75);
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        font-family: sans-serif;
        user-select: none;
      }
      #party-frames-handle {
        padding: 4px 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        background: #1a1a1a;
        cursor: grab;
        touch-action: none;
      }
      #party-frames-handle:active { cursor: grabbing; }
      #party-frames-rows { display: flex; flex-direction: column; gap: 4px; padding: 6px; }
      .party-frame-row { display: flex; flex-direction: column; gap: 2px; }
      .party-frame-name {
        font-size: 11px;
        color: #ccc;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .party-frame-row.self .party-frame-name { color: #00ff88; }
      .party-frame-bar-bg {
        position: relative;
        height: 16px;
        background: #222;
        border: 1px solid #333;
        border-radius: 3px;
        overflow: hidden;
      }
      .party-frame-bar-fill { height: 100%; background: #33dd55; }
      .party-frame-bar-text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: #fff;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.8);
      }

      /* Draggable (see draggable.ts), top-right by default — mirrors
         PartyFrames' top-left default — a live checklist for the current
         dungeon instance (see WorldRoom's synced dungeonObjectives room
         state). left/top are set by JS (makeDraggable), not here. */
      #dungeon-objectives {
        position: fixed;
        z-index: 15;
        width: 220px;
        background: rgba(17, 17, 17, 0.75);
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        font-family: sans-serif;
        user-select: none;
      }
      #dungeon-objectives-header {
        padding: 6px 10px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #ffcc33;
        background: #1a1a1a;
        cursor: grab;
        touch-action: none;
      }
      #dungeon-objectives-header:active { cursor: grabbing; }
      #dungeon-objectives-list { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; }
      .dungeon-objective-row { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: #ddd; }
      .dungeon-objective-row.completed { color: #666; text-decoration: line-through; }
      .dungeon-objective-check { color: #00ff88; flex-shrink: 0; }
      .dungeon-objective-row.completed .dungeon-objective-check { color: #666; }
      .dungeon-objective-text { line-height: 1.3; }

      #dungeon-prompt-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        font-family: sans-serif;
      }
      /* The dungeon info panel and the docked GroupFinder panel (see
         DungeonPrompt.show, which hands GroupFinder this dock element) sit
         side by side inside the one shared backdrop, rather than each
         popping its own separate darkened overlay. */
      .dungeon-prompt-row { display: flex; align-items: flex-start; gap: 16px; }
      #dungeon-prompt-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 20px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        width: 320px;
        max-height: 80vh;
        overflow-y: auto;
      }
      #dungeon-prompt-panel h3 { margin: 0; color: #9d4dff; font-size: 16px; }
      .dungeon-prompt-min-level { color: #ffcc66; font-size: 12px; font-weight: 600; }
      .dungeon-prompt-description { margin: 0; color: #ccc; font-size: 13px; line-height: 1.4; }
      .group-finder-dock {
        display: flex;
        flex-direction: column;
        padding: 20px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        width: 260px;
        max-height: 80vh;
        overflow-y: auto;
      }
      .dungeon-prompt-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #2a2a2a;
      }
      .dungeon-prompt-enter-btn {
        padding: 8px 16px;
        font-size: 13px;
        border-radius: 4px;
        border: none;
        background: #9d4dff;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }
      .dungeon-prompt-enter-btn:hover { background: #b06bff; }
      .dungeon-prompt-cancel-btn {
        padding: 8px 16px;
        font-size: 13px;
        border-radius: 4px;
        border: 1px solid #444;
        background: none;
        color: #ccc;
        cursor: pointer;
      }
      .dungeon-prompt-cancel-btn:hover { background: #262626; }

      .auth-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: sans-serif;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        background: #1e1e1e;
        border-radius: 8px;
        min-width: 240px;
      }
      .auth-form h1 {
        margin: 0 0 4px;
        color: #fff;
        font-size: 18px;
      }
      .auth-form p {
        margin: 0 0 4px;
        color: #999;
        font-size: 13px;
      }
      #username-input,
      #password-input,
      #class-select {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
      }
      #class-select-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #999;
      }
      .auth-error {
        margin: 0;
        color: #ff6666;
        font-size: 12px;
        min-height: 14px;
      }
      #login-mode-toggle {
        background: none;
        border: none;
        color: #00ff88;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
        text-align: left;
      }
      .auth-form button[type="submit"] {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        cursor: pointer;
        font-weight: bold;
      }
      .auth-form button[type="button"] {
        background: none;
        border: 1px solid #444;
        color: #ccc;
        border-radius: 4px;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .auth-form button[type="button"]:hover { background: #262626; }

      #character-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 220px;
      }
      #character-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 10px;
        background: #111;
        border: 1px solid #333;
        border-radius: 4px;
      }
      #character-list .character-name { color: #fff; font-size: 14px; }
      #character-list .character-class { color: #999; font-size: 12px; }
      #character-list button {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        cursor: pointer;
        font-weight: bold;
      }
      #character-list-empty {
        margin: 0;
        color: #999;
        font-size: 13px;
      }

      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: sans-serif;
      }
      #loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top-color: #00ff88;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }
      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }
      #loading-text {
        color: #ccc;
        font-size: 14px;
      }
      #loading-error {
        color: #ff6666;
        font-size: 13px;
        max-width: 320px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="loading-spinner"></div>
      <p id="loading-text">Entering the world&hellip;</p>
      <p id="loading-error"></p>
    </div>
    <div id="login-overlay" class="auth-overlay">
      <form id="login-form" class="auth-form">
        <h1>mmorpg-navigateur</h1>
        <input id="username-input" type="text" placeholder="Username" autocomplete="username" required />
        <input id="password-input" type="password" placeholder="Password" autocomplete="current-password" required />
        <p id="login-error" class="auth-error"></p>
        <button type="submit" id="login-submit">Log in</button>
        <button type="button" id="login-mode-toggle">New player? Create an account</button>
      </form>
    </div>
    <div id="character-overlay" class="auth-overlay" style="display: none">
      <div id="character-select-panel" class="auth-form">
        <h1>Choose your character</h1>
        <ul id="character-list"></ul>
        <p id="character-list-empty" style="display: none">You have no characters yet.</p>
        <p id="character-select-error" class="auth-error"></p>
        <button type="button" id="character-create-toggle">+ Create new character</button>
      </div>
      <form id="character-form" class="auth-form" style="display: none">
        <h1>Create your character</h1>
        <input id="character-name-input" type="text" placeholder="Character name" autocomplete="off" required />
        <label id="class-select-label">
          Class
          <select id="class-select"></select>
        </label>
        <p id="character-form-error" class="auth-error"></p>
        <button type="submit">Create &amp; play</button>
        <button type="button" id="character-create-cancel">Back</button>
      </form>
    </div>
    <div id="game-layout">
      <div id="app"></div>
      <button type="button" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
      <aside id="sidebar">
        <div id="sidebar-tabs">
          <span class="sidebar-tab" data-panel="chat">Chat <kbd>C</kbd></span>
          <span class="sidebar-tab" data-panel="inventory">Inventory <kbd>I</kbd></span>
          <span class="sidebar-tab" data-panel="quests">Quest Log <kbd>L</kbd></span>
          <span class="sidebar-tab" data-panel="stats">Character <kbd>K</kbd></span>
          <span class="sidebar-tab" data-panel="talents">Talents <kbd>T</kbd></span>
          <span class="sidebar-tab" data-panel="party">Party <kbd>P</kbd></span>
        </div>
        <div id="sidebar-body">Coming soon</div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
