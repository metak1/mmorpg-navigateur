<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mmorpg-navigateur</title>
    <style>
      html, body { margin: 0; background: #111; }

      #game-layout {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 16px;
        height: 100vh;
        padding: 16px;
        box-sizing: border-box;
      }

      #app { flex: 0 0 auto; line-height: 0; }

      /* One big panel that swaps content (chat by default). Height matches
         the Phaser canvas (see VIEWPORT_HEIGHT in main.ts) so it lines up. */
      #sidebar {
        flex: 0 0 300px;
        height: 700px;
        display: flex;
        flex-direction: column;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        font-family: sans-serif;
      }

      #sidebar-tabs {
        display: flex;
        gap: 4px;
        padding: 8px;
        border-bottom: 1px solid #333;
      }
      .sidebar-tab {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 4px;
        border-radius: 6px;
        font-size: 12px;
        color: #888;
        cursor: pointer;
        user-select: none;
      }
      .sidebar-tab:hover { background: #242424; color: #ccc; }
      .sidebar-tab.active { background: #2a2a2a; color: #fff; }
      .sidebar-tab kbd {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: #000;
        border: 1px solid #444;
        color: #999;
      }

      #sidebar-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        color: #555;
        font-size: 13px;
        padding: 12px;
      }

      #quest-log-list { display: flex; flex-direction: column; gap: 10px; }
      .quest-log-item {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .quest-log-title { color: #fff; font-size: 13px; font-weight: 600; }
      .quest-log-summary { color: #999; font-size: 12px; margin-top: 4px; }

      #npc-dialogue-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        font-family: sans-serif;
      }
      #npc-dialogue-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        min-width: 320px;
        max-width: 420px;
      }
      #npc-dialogue-panel h3 { margin: 0; color: #00ff88; font-size: 16px; }
      .npc-dialogue-empty { color: #999; font-size: 13px; margin: 0; }
      .npc-dialogue-option {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
      }
      .npc-dialogue-option-title { color: #fff; font-size: 14px; font-weight: 600; }
      .npc-dialogue-option-desc { color: #aaa; font-size: 12px; }
      .npc-dialogue-option-summary { color: #ffcc66; font-size: 12px; }
      .npc-dialogue-hint { color: #666; font-size: 11px; font-style: italic; }
      .npc-dialogue-option button {
        align-self: flex-start;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        font-weight: bold;
        cursor: pointer;
      }
      #npc-dialogue-close {
        align-self: flex-end;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid #444;
        background: none;
        color: #ccc;
        cursor: pointer;
      }

      .auth-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: sans-serif;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        background: #1e1e1e;
        border-radius: 8px;
        min-width: 240px;
      }
      .auth-form h1 {
        margin: 0 0 4px;
        color: #fff;
        font-size: 18px;
      }
      .auth-form p {
        margin: 0 0 4px;
        color: #999;
        font-size: 13px;
      }
      #username-input,
      #password-input,
      #class-select {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
      }
      #class-select-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #999;
      }
      .auth-error {
        margin: 0;
        color: #ff6666;
        font-size: 12px;
        min-height: 14px;
      }
      #login-mode-toggle {
        background: none;
        border: none;
        color: #00ff88;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
        text-align: left;
      }
      .auth-form button[type="submit"] {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        cursor: pointer;
        font-weight: bold;
      }
      .auth-form button[type="button"] {
        background: none;
        border: 1px solid #444;
        color: #ccc;
        border-radius: 4px;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .auth-form button[type="button"]:hover { background: #262626; }

      #character-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 220px;
      }
      #character-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 10px;
        background: #111;
        border: 1px solid #333;
        border-radius: 4px;
      }
      #character-list .character-name { color: #fff; font-size: 14px; }
      #character-list .character-class { color: #999; font-size: 12px; }
      #character-list button {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        cursor: pointer;
        font-weight: bold;
      }
      #character-list-empty {
        margin: 0;
        color: #999;
        font-size: 13px;
      }

      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: sans-serif;
      }
      #loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top-color: #00ff88;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }
      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }
      #loading-text {
        color: #ccc;
        font-size: 14px;
      }
      #loading-error {
        color: #ff6666;
        font-size: 13px;
        max-width: 320px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="loading-spinner"></div>
      <p id="loading-text">Entering the world&hellip;</p>
      <p id="loading-error"></p>
    </div>
    <div id="login-overlay" class="auth-overlay">
      <form id="login-form" class="auth-form">
        <h1>mmorpg-navigateur</h1>
        <input id="username-input" type="text" placeholder="Username" autocomplete="username" required />
        <input id="password-input" type="password" placeholder="Password" autocomplete="current-password" required />
        <p id="login-error" class="auth-error"></p>
        <button type="submit" id="login-submit">Log in</button>
        <button type="button" id="login-mode-toggle">New player? Create an account</button>
      </form>
    </div>
    <div id="character-overlay" class="auth-overlay" style="display: none">
      <div id="character-select-panel" class="auth-form">
        <h1>Choose your character</h1>
        <ul id="character-list"></ul>
        <p id="character-list-empty" style="display: none">You have no characters yet.</p>
        <p id="character-select-error" class="auth-error"></p>
        <button type="button" id="character-create-toggle">+ Create new character</button>
      </div>
      <form id="character-form" class="auth-form" style="display: none">
        <h1>Create your character</h1>
        <input id="character-name-input" type="text" placeholder="Character name" autocomplete="off" required />
        <label id="class-select-label">
          Class
          <select id="class-select"></select>
        </label>
        <p id="character-form-error" class="auth-error"></p>
        <button type="submit">Create &amp; play</button>
        <button type="button" id="character-create-cancel">Back</button>
      </form>
    </div>
    <div id="game-layout">
      <div id="app"></div>
      <aside id="sidebar">
        <div id="sidebar-tabs">
          <span class="sidebar-tab" data-panel="chat">Chat <kbd>C</kbd></span>
          <span class="sidebar-tab" data-panel="inventory">Inventory <kbd>I</kbd></span>
          <span class="sidebar-tab" data-panel="quests">Quest Log <kbd>L</kbd></span>
        </div>
        <div id="sidebar-body">Coming soon</div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
