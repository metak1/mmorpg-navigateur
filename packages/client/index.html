<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mmorpg-navigateur</title>
    <style>
      html, body { margin: 0; background: #111; }

      #game-layout {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 16px;
        height: 100vh;
        padding: 16px;
        box-sizing: border-box;
      }

      #app { flex: 0 0 auto; line-height: 0; }

      /* One big panel that swaps content (chat by default). Height matches
         the Phaser canvas (see VIEWPORT_HEIGHT in main.ts) so it lines up. */
      #sidebar {
        flex: 0 0 300px;
        height: 700px;
        display: flex;
        flex-direction: column;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        font-family: sans-serif;
      }

      #sidebar-tabs {
        display: flex;
        gap: 4px;
        padding: 8px;
        border-bottom: 1px solid #333;
      }
      .sidebar-tab {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 4px;
        border-radius: 6px;
        font-size: 12px;
        color: #888;
        cursor: pointer;
        user-select: none;
      }
      .sidebar-tab:hover { background: #242424; color: #ccc; }
      .sidebar-tab.active { background: #2a2a2a; color: #fff; }
      .sidebar-tab kbd {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: #000;
        border: 1px solid #444;
        color: #999;
      }

      #sidebar-body {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        font-size: 13px;
        padding: 12px;
      }

      #login-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: sans-serif;
      }
      #login-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        background: #1e1e1e;
        border-radius: 8px;
        min-width: 240px;
      }
      #login-form h1 {
        margin: 0 0 4px;
        color: #fff;
        font-size: 18px;
      }
      #username-input,
      #class-select {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
      }
      #class-select-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #999;
      }
      #login-form button {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: none;
        background: #00ff88;
        color: #111;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="login-overlay">
      <form id="login-form">
        <h1>mmorpg-navigateur</h1>
        <input id="username-input" type="text" placeholder="Username" autocomplete="off" required />
        <label id="class-select-label">
          Class (new characters only)
          <select id="class-select"></select>
        </label>
        <button type="submit">Play</button>
      </form>
    </div>
    <div id="game-layout">
      <div id="app"></div>
      <aside id="sidebar">
        <div id="sidebar-tabs">
          <span class="sidebar-tab" data-panel="chat">Chat <kbd>C</kbd></span>
          <span class="sidebar-tab" data-panel="inventory">Inventory <kbd>I</kbd></span>
          <span class="sidebar-tab" data-panel="quests">Quest Log <kbd>L</kbd></span>
        </div>
        <div id="sidebar-body">Coming soon</div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
