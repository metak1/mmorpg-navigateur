<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mmorpg-navigateur admin</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
      #app { display: flex; min-height: 100vh; }

      #sidebar {
        width: 180px;
        background: #1a1a1a;
        border-right: 1px solid #2a2a2a;
        padding: 16px;
        flex-shrink: 0;
      }
      #sidebar h1 { font-size: 16px; margin: 0 0 16px; color: #00ff88; }
      #sidebar a {
        display: block;
        padding: 8px 10px;
        margin-bottom: 4px;
        color: #ccc;
        text-decoration: none;
        border-radius: 4px;
      }
      #sidebar a:hover { background: #232323; }
      #sidebar a.active { background: #00ff88; color: #111; font-weight: bold; }

      #content { flex: 1; padding: 24px; overflow-x: auto; }
      #content h2 { margin-top: 0; }
      #content h3 { color: #aaa; }

      table.admin-table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
      table.admin-table th, table.admin-table td {
        border: 1px solid #2a2a2a;
        padding: 6px 10px;
        text-align: left;
        font-size: 13px;
      }
      table.admin-table th { background: #1a1a1a; }
      table.admin-table tr:nth-child(even) { background: #161616; }

      form.admin-form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        background: #1a1a1a;
        padding: 16px;
        border-radius: 6px;
        margin-bottom: 20px;
      }
      form.admin-form .field { display: flex; flex-direction: column; }
      form.admin-form label { font-size: 12px; color: #999; display: flex; flex-direction: column; gap: 4px; }
      form.admin-form input, form.admin-form select {
        background: #111;
        border: 1px solid #333;
        color: #eee;
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 13px;
        min-width: 90px;
      }

      button {
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #3a3a3a;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover { background: #333; }
      button[type="submit"] { background: #00ff88; color: #111; font-weight: bold; border: none; }
      button.danger { background: #552222; border-color: #663333; }
      button.danger:hover { background: #703030; }

      .new-map-form { display: flex; gap: 12px; align-items: flex-end; background: #1a1a1a; padding: 16px; border-radius: 6px; margin-bottom: 20px; }
      .new-map-form label { font-size: 12px; color: #999; display: flex; flex-direction: column; gap: 4px; }
      .new-map-form input { background: #111; border: 1px solid #333; color: #eee; padding: 6px 8px; border-radius: 4px; width: 100px; }

      .map-editor { display: flex; flex-direction: column; gap: 12px; }
      .map-editor-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .map-editor-toolbar button.active { outline: 2px solid #00ff88; }
      .map-editor-canvas { border: 1px solid #333; cursor: crosshair; image-rendering: pixelated; }
      .map-editor-actions { display: flex; gap: 8px; }

      #sidebar-footer { margin-top: 16px; padding-top: 16px; border-top: 1px solid #2a2a2a; }

      #login-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
      }
      #admin-login-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        background: #1a1a1a;
        border-radius: 8px;
        min-width: 280px;
      }
      #admin-login-form h1 { margin: 0 0 4px; color: #fff; font-size: 18px; }
      #admin-username-input,
      #admin-password-input {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
      }
      #admin-login-error {
        margin: 0;
        color: #ff6666;
        font-size: 12px;
        min-height: 14px;
      }
      #admin-login-form button[type="submit"] { padding: 8px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="sidebar">
        <h1>Content Admin</h1>
        <a href="#classes" data-tab="classes">Classes</a>
        <a href="#monsters" data-tab="monsters">Monsters</a>
        <a href="#spells" data-tab="spells">Spells</a>
        <a href="#maps" data-tab="maps">Maps</a>
        <div id="sidebar-footer">
          <a href="#" id="logout-link">Log out</a>
        </div>
      </nav>
      <main id="content"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
